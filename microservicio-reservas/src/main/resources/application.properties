
spring.application.name=microservicio-reservas

server.port=${SERVER_PORT:8081}



spring.datasource.url=${DB_URL:jdbc:h2:file:./data/reservas-api;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console


usuarios.service.url=${USUARIOS_SERVICE_URL:http://localhost:8082}


espacios.service.url=${ESPACIOS_SERVICE_URL:http://localhost:8083}


google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
google.calendar.credentials-file=${GOOGLE_CALENDAR_CREDENTIALS_FILE:}
google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:primary}
google.calendar.time-zone=${GOOGLE_CALENDAR_TIME_ZONE:America/Argentina/Buenos_Aires}


spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tpi-reservas}
