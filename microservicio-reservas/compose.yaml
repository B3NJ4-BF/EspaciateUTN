services:
  microservicio-reservas:
    build: .
    container_name: microservicio-reservas
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:h2:file:/app/data/reservas-api;DB_CLOSE_ON_EXIT=FALSE
    volumes:
      - reservas_data:/app/data
    restart: unless-stopped

volumes:
  reservas_data:
